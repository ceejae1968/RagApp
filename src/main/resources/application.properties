spring.application.name=ragApp


# ----------------------------------------------------
# Local Dockerized Ollama Configurations
# ----------------------------------------------------
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.embedding.options.model=mxbai-embed-large


# Vector Store Setup (Mapping to your pgvector starter)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Tells Spring AI to auto-generate the necessary vector tables on startup
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
